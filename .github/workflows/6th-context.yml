name: trying out context
on: [push]

jobs:
  my-context:
    runs-on: ubuntu-latest
    env:
      MY_ACTION: ${{ github.action }}
      MY_ACTOR: ${{ github.actor }}
    steps:
      - name: "Action"
        run: echo "Hello my action $MY_ACTION"
      - name: "Actor"
        run: echo "Hello my actor $MY_ACTOR"
