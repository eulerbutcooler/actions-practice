name: Github Actions Demo
run-name: ${{ github.actor }} is testing out Github Actions 
on: [push]
jobs:
    Explore-Github-Actions:
        runs-on: ubuntu-latest
        steps:
            - run : echo "Yo this was trigged by ${{ github.event_name }} event"
            - run : echo "This job is running on ${{ runner.os }}"
            - run : echo "The name of the repo branch is ${{ github.ref }} and repo is ${{ github.repository  }}."
            - name: Checkout repo code
              uses: actions/checkout@v5
            - run: echo "The ${{ github.repository }} repo has been cloned to the runner."
            - run: echo "Yo pierre you wanna come out here? Ready to test the code on the runner."
            - name: List files in the repo
              run: | 
            ls ${{ github.workspace }}
            - run: echo "The job's status is ${{ job.status }}."
